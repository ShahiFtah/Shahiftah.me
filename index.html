<script>
/*
  Nytt design hvert døgn (norsk tid). Alle besøkende ser samme design samme dag.
  Rekkefølgen går i ring: T-bane → Byggetegning → System-boot → T-bane …
  Forhåndsvis et bestemt design med ?design=tbane | tegning | boot
*/
(function () {
  var DESIGNS = {
    tbane:   'shahiftah-tbanelinja.html',
    tegning: 'shahiftah-byggetegning.html',
    boot:    'shahiftah-systemboot.html'
  };
  var ORDER = ['tbane', 'tegning', 'boot'];

  // dagens dato i Oslo → dagnummer → design
  var osloDate = new Date().toLocaleDateString('sv-SE', { timeZone: 'Europe/Oslo' }); // "2026-11-09"
  var p = osloDate.split('-');
  var day = Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  var key = ORDER[day % ORDER.length];

  var forced = new URLSearchParams(location.search).get('design');
  if (forced && DESIGNS[forced]) key = forced;
  var file = DESIGNS[key];

  // Last designet inn uten å endre adressen (shahiftah.me forblir shahiftah.me)
  fetch(file, { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw 0; return r.text(); })
    .then(function (html) { document.open(); document.write(html); document.close(); })
    .catch(function () { location.replace(file); });
})();
</script>
